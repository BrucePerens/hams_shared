[package]
name = "hams_lint"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "One parallel lint engine: reads each file once, applies declarative rules (rules/checks.toml) and Rust algorithms, caches results by content hash"

[[bin]]
name = "hams_lint"
path = "src/main.rs"

[dependencies]
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = 3
