# Dependabot version updates. Without this file Dependabot watches nothing:
# a RUSTSEC advisory was found by cargo audit in CI while Dependabot showed 0 alerts.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directory: "/tools/rust_function_scan"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
