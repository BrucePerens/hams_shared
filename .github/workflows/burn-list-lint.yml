name: Burn-List Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# ADR-0102 (hams_com repo): the required status check gating merges to main.
permissions:
  contents: read

jobs:
  burn-list:
    runs-on: [self-hosted, hams-devbox]
    steps:
      - name: Checkout hams_shared
        uses: actions/checkout@v6

      - name: Run the burn-list linter
        run: python3 tools/check_burn_list.py --scan-daemons-and-tools .
